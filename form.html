<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
    <link rel="stylesheet" href="form-styles.css">
</head>
<body>
    <div class="form-container" id="feedback-section">
        <h2>Feedback Form</h2>
        
        <form>

    <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email">
            </div>
    <div class="form-group">
                <label for="role">Role:</label>
                <select id="role" name="role">
                    <option value="">Select your role</option>
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                    <option value="other">Other</option>
                </select>
            </div>
    <div class="form-group">
                <label>Do you find this website helpful?</label>
                <div class="radio-group">
                    <label class="radio-label"><input type="radio" name="helpful" value="yes"> Yes</label>
                    <label class="radio-label"><input type="radio" name="helpful" value="no"> No</label>
                </div>
            </div>
    <div class="form-group">
                <label for="comments">Comments:</label>
                <textarea id="comments" name="comments" rows="4" placeholder="Write your comments here..."></textarea>
            </div>
    <button type="submit" class="submit-btn">Submit Feedback</button>
        </form>
    </div>

</body>
</html>
